<style>
:root{
  --navy:#0B2A4A;
  --navy-2:#123A63;
  --navy-3:#1B4D7E;
  --accent:#0091D5;
  --accent-2:#00B8A9;
  --warn:#E8732C;
  --bg:#EEF1F5;
  --panel:#FFFFFF;
  --line:#D8DEE6;
  --text:#1C2733;
  --muted:#5C6B7A;
  --mono:'Consolas','SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI','Noto Sans TC',Arial,sans-serif;font-size:13px;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;font-size:12.5px;}

/* ===== Top bar ===== */
#topbar{
  height:52px;background:linear-gradient(180deg,var(--navy-2),var(--navy));
  display:flex;align-items:center;padding:0 16px;color:#fff;gap:18px;
  box-shadow:0 2px 6px rgba(0,0,0,.25);position:relative;z-index:20;
}
#topbar .logo{font-weight:700;font-size:17px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;}
#topbar .logo .mark{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:inline-block;}
#topbar .sub{font-size:11px;color:#9FC4E0;font-weight:400;margin-left:4px;}
#topbar .spacer{flex:1;}
#topbar .tb-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;
  padding:6px 12px;border-radius:4px;font-size:12px;display:flex;align-items:center;gap:6px;
}
#topbar .tb-btn:hover{background:rgba(255,255,255,.18);}
#topbar select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:5px 8px;}
#topbar select option{color:#000;}

/* ===== Layout ===== */
#app{display:flex;height:calc(100% - 52px);}
#sidebar{
  width:270px;background:#0F2138;color:#cfe0f0;overflow-y:auto;flex-shrink:0;
  border-right:1px solid #06121f;
}
#sidebar .side-section-title{
  padding:10px 14px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6F90AC;font-weight:600;
}
.tree-node{padding:7px 10px 7px 16px;display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;border-left:3px solid transparent;}
.tree-node:hover{background:rgba(255,255,255,.05);}
.tree-node.active{background:rgba(0,145,213,.18);border-left-color:var(--accent);color:#fff;}
.tree-node .ic{width:14px;text-align:center;opacity:.85;font-size:12px;}
.tree-floor{font-weight:600;color:#E7F0F8;}
.tree-room{padding-left:34px;color:#B9CEE0;}
.tree-room.active{color:#fff;}
.tree-add{padding:6px 14px;font-size:11.5px;color:var(--accent);background:none;border:none;width:100%;text-align:left;}
.tree-add:hover{text-decoration:underline;}
.tree-actions{margin-left:auto;display:flex;gap:4px;opacity:0;}
.tree-node:hover .tree-actions{opacity:1;}
.tree-actions span{font-size:11px;padding:1px 4px;color:#9FB6CB;}
.tree-actions span:hover{color:#fff;}
#sidebar-footer{padding:10px 14px;border-top:1px solid #1c344c;font-size:11px;color:#7691A8;}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#tabbar{
  display:flex;background:#fff;border-bottom:1px solid var(--line);padding:0 14px;flex-shrink:0;
}
.tabbtn{
  padding:11px 18px;font-size:12.5px;color:var(--muted);background:none;border:none;border-bottom:3px solid transparent;font-weight:600;
}
.tabbtn.active{color:var(--navy);border-bottom-color:var(--accent);}
.tabbtn:hover{color:var(--navy-3);}

#content{flex:1;overflow-y:auto;padding:18px 22px;}

/* ===== Cards / forms ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:16px;}
.card-head{padding:10px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;color:var(--navy);display:flex;align-items:center;justify-content:space-between;}
.card-body{padding:14px 16px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 16px;}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.field input,.field select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:#FBFCFE;}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
.field .unit{color:var(--muted);font-size:10.5px;}

table.dtable{width:100%;border-collapse:collapse;font-size:12px;}
table.dtable th{background:#F2F5F9;color:var(--navy-2);text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
table.dtable td{padding:6px 8px;border-bottom:1px solid #EEF1F5;}
table.dtable tr:hover td{background:#F8FAFC;}
table.dtable input,table.dtable select{padding:4px 6px;font-size:12px;}
.numcell{font-family:var(--mono);text-align:right;}

.btn{background:var(--navy-3);color:#fff;border:none;padding:7px 14px;border-radius:4px;font-size:12px;font-weight:600;}
.btn:hover{background:var(--accent);}
.btn.sm{padding:4px 9px;font-size:11px;}
.btn.ghost{background:#fff;color:var(--navy-3);border:1px solid var(--navy-3);}
.btn.ghost:hover{background:#EAF4FC;}
.btn.danger{background:#fff;color:#C0392B;border:1px solid #E2A39B;}
.btn.danger:hover{background:#FBEEEC;}

.kpi-row{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.kpi{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:13px 16px;}
.kpi .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.kpi .val{font-size:24px;font-weight:700;color:var(--navy);font-family:var(--mono);margin-top:3px;}
.kpi .val span{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px;}
.kpi.accent{border-top:3px solid var(--accent);}
.kpi.warn{border-top:3px solid var(--warn);}
.kpi.teal{border-top:3px solid var(--accent-2);}

.chart-wrap{position:relative;height:280px;}
.chart-wrap.small{height:220px;}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
@media(max-width:1100px){.two-col{grid-template-columns:1fr;}}

.tagrow{display:flex;gap:6px;flex-wrap:wrap;}
.tag{background:#EAF4FC;color:var(--navy-3);border-radius:3px;padding:2px 8px;font-size:11px;font-weight:600;}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .big{font-size:34px;margin-bottom:8px;}

#welcome{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;color:var(--muted);}
#welcome h2{color:var(--navy);}

.note{font-size:11px;color:var(--muted);background:#F6F8FA;border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 4px 4px 0;margin-top:10px;line-height:1.5;}
.removeRow{color:#C0392B;cursor:pointer;font-weight:700;}
.addRowBtn{margin-top:8px;}
.schedBox{display:flex;gap:2px;flex-wrap:wrap;margin-top:6px;}
.schedHour{width:28px;text-align:center;}
.schedHour input{width:100%;padding:3px 0;text-align:center;font-size:10.5px;}
.schedHour .hl{font-size:9px;color:var(--muted);display:block;}
</style>
</head>

const SOLAR_PEAK = {
  N:{peakHour:12, peakVal:90, width:12},
  NE:{peakHour:8, peakVal:420, width:5},
  E:{peakHour:9, peakVal:520, width:5},

// 將 0-based 年度小時索引(0~8759) 轉為 {month(1-12), day, hourOfDay(0-23)}
function idxToDate(idx){
  let h = idx % 24;
  let dayOfYear = Math.floor(idx/24); // 0-based
  let m=0, d=dayOfYear;
  while(d >= DAYS_2025[m]){ d -= DAYS_2025[m]; m++; }
  return {month:m+1, day:d+1, hour:h};
}
function dateToIdx(month, day, hour){
  let dayOfYear=0;
  for(let i=0;i<month-1;i++) dayOfYear += DAYS_2025[i];
  dayOfYear += (day-1);
  return dayOfYear*24 + hour;
}

/* ---------- 工具函式 ---------- */
function uid(){return Math.random().toString(36).slice(2,9);}
function clone(o){return JSON.parse(JSON.stringify(o));}

// Magnus飽和水氣壓 (kPa), T in °C
function pSat(T){return 0.6108*Math.exp(17.27*T/(T+237.3));}
// 由 DB(°C)+RH(%) 求濕度比 (kg/kg)
function humidityRatioFromRH(Tdb,RH,P=101.325){
  const ps = pSat(Tdb)*(RH/100);
  return 0.622*ps/(P-ps);
}
function enthalpyMoistAir(Tdb,W){ // kJ/kg dry air
  return 1.006*Tdb + W*(2501+1.86*Tdb);
}

function hourArray(){return Array.from({length:24},(_,i)=>i);}

function outdoorTempAt(t, meanDB, range){
  // 簡化日溫度週期：尖峰在15:00
  return meanDB + (range/2)*Math.cos((t-15)*15*Math.PI/180);
}
function solarAt(orientation, t){
  const o = SOLAR_PEAK[orientation];
  let diff = Math.abs(t-o.peakHour);
  if(diff>12) diff = 24-diff;
  const frac = Math.cos((diff/o.width)*(Math.PI/2));
  return Math.max(0, o.peakVal*frac);
}
function solarHoriz(t){
  const o = SOLAR_PEAK.HORIZ;
  let diff = Math.abs(t-o.peakHour);
  if(diff>12) diff=24-diff;
  const frac = Math.cos((diff/o.width)*(Math.PI/2));
  return Math.max(0,o.peakVal*frac);
}
function schedVal(sched,t){
  const i0=Math.floor(t)%24;
  return sched[i0]!==undefined?sched[i0]:0;
}

/* =========================== 計算引擎 =========================== */
function calcRoomHourly(room){
  const dc = state.project.designConditions;
  const Tin = dc.indoorDB;
  const Win = humidityRatioFromRH(Tin, dc.indoorRH);
  const Wout = humidityRatioFromRH(dc.summerDB, (function(){
      // 由WB估算室外RH（簡化：用WB,DB估計濕度比再換算RH不必要，直接用WB估濕度比近似）
      return 50;
  })());
  // 更精確：以summerDB & summerWB計算室外濕度比（簡化WB迭代略過，採近似公式）
  const Tdb=dc.summerDB, Twb=dc.summerWB;
  const Wsat_wb = humidityRatioFromRH(Twb,100);
  const Wout2 = ((2501-2.326*Twb)*Wsat_wb - 1.006*(Tdb-Twb)) / (2501+1.86*Tdb-4.186*Twb);
  const mass = MASS_FACTORS[room.constructionMass];

  const hours = hourArray();
  const results = hours.map(t=>{
    const Tout_t = outdoorTempAt(t, Tdb, dc.dailyRange);
    const Tout_lag = outdoorTempAt(((t-mass.lag)+24)%24, Tdb, dc.dailyRange);

    // --- 外牆傳導 (含構造蓄熱延遲衰減) ---
    let wallCond=0;
    room.walls.forEach(w=>{
      const dT = (Tout_lag - Tin);
      wallCond += w.uValue * w.area * dT * mass.decrement;
    });

    // --- 窗戶傳導 (輕質、無延遲) ---
    let winCond=0, winSolar=0;
    room.windows.forEach(w=>{
      winCond += w.uValue * w.area * (Tout_t - Tin);
      const I = solarAt(w.orientation, t);
      winSolar += w.area * w.shgc * w.shadeFactor * I;
    });

    // --- 屋頂 (含日射輻射溫度修正) ---
    let roofCond=0;
    if(room.roof.exposed){
      const Ihoriz = solarHoriz(((t-mass.lag)+24)%24);
      const solAirRise = (room.roof.absorptivity*Ihoriz)/17; // ho=17 W/m2K
      const Tsolair = Tout_lag + solAirRise;
      roofCond = room.roof.uValue*room.roof.area*(Tsolair-Tin)*mass.decrement;
    }

    // --- 內部負荷 ---
    const occFrac = schedVal(room.peopleSched,t);
    const peopleS = room.peopleCount*occFrac*room.occW;
    const peopleL = room.peopleCount*occFrac*room.occLat;
    const lightS = room.lightingW*room.area*schedVal(room.lightSched,t);
    const equipS = room.equipW*room.area*schedVal(room.equipSched,t);

    // --- 通風 + 滲透 ---
    const ventQ_Ls = room.ventLps*room.peopleCount*occFrac;
    const infilVol_m3h = room.infACH*room.area*room.height;
    const infilQ_Ls = infilVol_m3h/3.6;
    const totalQ_Ls = ventQ_Ls + infilQ_Ls;
    const ventS = 1.23*totalQ_Ls*(Tdb-Tin);
    const ventL = 3010*(totalQ_Ls/1000)*Math.max(0,(Wout2-Win));

    const sensible = wallCond+winCond+winSolar+roofCond+peopleS+lightS+equipS+ventS;
    const latent = peopleL+ventL;
    return {
      t, sensible, latent, total:sensible+latent,
      breakdown:{wallCond,winCond,winSolar,roofCond,peopleS,lightS,equipS,ventS,peopleL,ventL}
    };
  });
  return results;
}

function calcBuildingHourly(){
  const allRooms=[]; state.floors.forEach(f=>f.rooms.forEach(r=>allRooms.push(r)));
  const perRoom = allRooms.map(r=>({room:r, hourly:calcRoomHourly(r)}));
  const buildingHourly = hourArray().map(t=>{
    let s=0,l=0;
    perRoom.forEach(pr=>{s+=pr.hourly[t].sensible; l+=pr.hourly[t].latent;});
    return {t, sensible:s, latent:l, total:s+l};
  });
  let peakIdx=0;
  buildingHourly.forEach((h,i)=>{if(h.total>buildingHourly[peakIdx].total) peakIdx=i;});
  let blockTotal=0;
  perRoom.forEach(pr=>{ let pk=pr.hourly[0]; pr.hourly.forEach(h=>{if(h.total>pk.total) pk=h;}); blockTotal+=pk.total;});
  return {perRoom, buildingHourly, peakIdx, blockTotal};
}

/* =========================================================================
   全年真實逐時負荷計算引擎（六縣市模式）
   與 calcRoomHourly() 邏輯一致（外牆/開窗/屋頂/內部負荷/通風），差異僅在：
   - 外氣乾球溫度、相對濕度改為讀取 WEATHER_DB 真實逐時資料，取代單日餘弦模擬
   - 構造蓄熱延遲改為跨日真實索引回溯（比原設計日模式更正確）
   - 日射模型維持原「固定日射曲線」不變（本次進版方案F，未升級太陽幾何/晴空模型）
   ========================================================================= */
function calcRoomAnnual(room, cityKey){
  const wdb = WEATHER_DB[cityKey];
  const dc = state.project.designConditions;
  const Tin = dc.indoorDB;
  const Win = humidityRatioFromRH(Tin, dc.indoorRH);
  const mass = MASS_FACTORS[room.constructionMass];
  const lagH = Math.round(mass.lag);
  const N = 8760;
  const sensible = new Float32Array(N);
  const latent = new Float32Array(N);

  for(let idx=0; idx<N; idx++){
    const hourOfDay = idx % 24;
    const Tout_t = wdb.temp[idx];
    const RHout_t = wdb.rh[idx];
    const Wout_t = humidityRatioFromRH(Tout_t, RHout_t);
    const lagIdx = ((idx - lagH) % N + N) % N;
    const Tout_lag = wdb.temp[lagIdx];

    // --- 外牆傳導 (含構造蓄熱延遲衰減，跨日真實回溯) ---
    let wallCond=0;
    room.walls.forEach(w=>{
      wallCond += w.uValue * w.area * (Tout_lag - Tin) * mass.decrement;
    });

    // --- 窗戶傳導 + 日射 (日射仍採固定日曲線，依小時做週期，不隨日期變化) ---
    let winCond=0, winSolar=0;
    room.windows.forEach(w=>{
      winCond += w.uValue * w.area * (Tout_t - Tin);
      const I = solarAt(w.orientation, hourOfDay);
      winSolar += w.area * w.shgc * w.shadeFactor * I;
    });

    // --- 屋頂 ---
    let roofCond=0;
    if(room.roof.exposed){
      const Ihoriz = solarHoriz(((hourOfDay-lagH)+24)%24);
      const solAirRise = (room.roof.absorptivity*Ihoriz)/17;
      const Tsolair = Tout_lag + solAirRise;
      roofCond = room.roof.uValue*room.roof.area*(Tsolair-Tin)*mass.decrement;
    }

    // --- 內部負荷 (排程以「小時-of-day」週期套用，全年365天一致，不分平假日) ---
    const occFrac = schedVal(room.peopleSched, hourOfDay);
    const peopleS = room.peopleCount*occFrac*room.occW;
    const peopleL = room.peopleCount*occFrac*room.occLat;
    const lightS = room.lightingW*room.area*schedVal(room.lightSched,hourOfDay);
    const equipS = room.equipW*room.area*schedVal(room.equipSched,hourOfDay);

    // --- 通風 + 滲透 (顯熱項以真實外氣溫度驅動，潛熱項以真實外氣濕度比驅動) ---
    const ventQ_Ls = room.ventLps*room.peopleCount*occFrac;
    const infilVol_m3h = room.infACH*room.area*room.height;
    const infilQ_Ls = infilVol_m3h/3.6;
    const totalQ_Ls = ventQ_Ls + infilQ_Ls;
    const ventS = 1.23*totalQ_Ls*(Tout_t-Tin);
    const ventL = 3010*(totalQ_Ls/1000)*Math.max(0,(Wout_t-Win));

    sensible[idx] = wallCond+winCond+winSolar+roofCond+peopleS+lightS+equipS+ventS;
    latent[idx] = peopleL+ventL;
  }
  return {sensible, latent};
}

let _annualCache = null; // {cityKey, perRoom:[{room,sensible,latent}], buildingSensible, buildingLatent}
function calcBuildingAnnual(forceRecalc){
  const cityKey = state.project.realCity;
  if(!forceRecalc && _annualCache && _annualCache.cityKey===cityKey && _annualCache.roomCount===countAllRooms()){
    return _annualCache;
  }
  const allRooms=[]; state.floors.forEach(f=>f.rooms.forEach(r=>allRooms.push(r)));
  const N = 8760;
  const buildingSensible = new Float32Array(N);
  const buildingLatent = new Float32Array(N);
  const perRoom = allRooms.map(r=>{
    const res = calcRoomAnnual(r, cityKey);
    for(let i=0;i<N;i++){ buildingSensible[i]+=res.sensible[i]; buildingLatent[i]+=res.latent[i]; }
    return {room:r, sensible:res.sensible, latent:res.latent};
  });
  const buildingTotal = new Float32Array(N);
  let peakIdx=0;
  for(let i=0;i<N;i++){
    buildingTotal[i] = buildingSensible[i]+buildingLatent[i];
    if(buildingTotal[i] > buildingTotal[peakIdx]) peakIdx=i;
  }
  // 月別統計
  const monthly = MONTH_NAMES.map((label,mi)=>{
    const startIdx = dateToIdx(mi+1,1,0);
    const endIdx = startIdx + DAYS_2025[mi]*24; // exclusive
    let sum=0, peak=0, peakLocalIdx=startIdx;
    for(let i=startIdx;i<endIdx;i++){
      sum += buildingTotal[i];
      if(buildingTotal[i]>peak){peak=buildingTotal[i]; peakLocalIdx=i;}
    }
    const hours = endIdx-startIdx;
    return {
      label, kwhTotal: sum/1000, avgKw: (sum/hours)/1000, peakKw: peak/1000,
      peakDate: idxToDate(peakLocalIdx)
    };
  });
  const annualKwh = buildingTotal.reduce((a,b)=>a+b,0)/1000;
  _annualCache = {
    cityKey, roomCount: allRooms.length, perRoom,
    buildingSensible, buildingLatent, buildingTotal,
    peakIdx, monthly, annualKwh
  };
  return _annualCache;
}
function countAllRooms(){let c=0; state.floors.forEach(f=>c+=f.rooms.length); return c;}

function annualDayHourly(calc, month, day){
  // 回傳指定日期的24小時 {t, sensible, latent, total}
  const out=[];
  for(let h=0;h<24;h++){
    const idx = dateToIdx(month,day,h);
    out.push({t:h, sensible:calc.buildingSensible[idx], latent:calc.buildingLatent[idx], total:calc.buildingTotal[idx]});
  }
  return out;
}

function exportAnnualCSV(){
  const calc = calcBuildingAnnual(false);
  const wdb = WEATHER_DB[state.project.realCity];
  let csv = '日期,小時,室外乾球溫度(°C),室外相對濕度(%),顯熱負荷(W),潛熱負荷(W),總負荷(W)\n';
  for(let idx=0; idx<8760; idx++){
    const d = idxToDate(idx);
    const dateStr = `2025/${String(d.month).padStart(2,'0')}/${String(d.day).padStart(2,'0')}`;
    csv += `${dateStr},${d.hour}:00,${wdb.temp[idx]},${wdb.rh[idx]},${calc.buildingSensible[idx].toFixed(1)},${calc.buildingLatent[idx].toFixed(1)},${calc.buildingTotal[idx].toFixed(1)}\n`;
  }
  const blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download = `${state.project.name}_${REAL_CITY_LIST.find(c=>c.key===state.project.realCity).label}_全年逐時負荷_2025.csv`;
  a.click();
}

      <span class="ic">▾</span><span contenteditable="false">${f.name}</span>
      <span class="tree-actions"><span onclick="event.stopPropagation();renameFloor('${f.id}')">✎</span><span onclick="event.stopPropagation();deleteFloor('${f.id}')">✕</span></span>
      </div>`;
    f.rooms.forEach(r=>{
      const active = selection.roomId===r.id;
      html += `<div class="tree-node tree-room ${active?'active':''}" onclick="selectRoom('${f.id}','${r.id}')">
        <span class="ic">▪</span><span>${r.name}</span>
        <span class="tree-actions"><span onclick="event.stopPropagation();renameRoom('${f.id}','${r.id}')">✎</span><span onclick="event.stopPropagation();deleteRoom('${f.id}','${r.id}')">✕</span></span>
        </div>`;
    });
    html += `<button class="tree-add" onclick="addRoom('${f.id}')">＋ 新增房間</button>`;
  });
  html += `<button class="tree-add" style="padding-left:14px;border-top:1px solid #1c344c;margin-top:4px;" onclick="addFloor()">＋ 新增樓層</button>`;
  wrap.innerHTML = html;
}

function selectRoom(fid,rid){selection.page='summary';selection.floorId=fid;selection.roomId=rid;activeTab='geometry';renderTree();renderTabs();renderContent();}

function addRoom(fid){const f=findFloor(fid); const r=newRoom('新房間 '+(f.rooms.length+1),'office'); f.rooms.push(r); selectRoom(fid,r.id);}
function renameFloor(fid){const f=findFloor(fid); const n=prompt('樓層名稱',f.name); if(n){f.name=n; renderTree();}}

function deleteFloor(fid){
  if(state.floors.length<=1){alert('至少需保留一個樓層');return;}
  if(!confirm('刪除此樓層及所有房間？'))return;
  state.floors = state.floors.filter(f=>f.id!==fid);
  selection.page='summary'; selection.floorId=state.floors[0].id; selection.roomId=state.floors[0].rooms[0]?.id||null;
  renderAll();
}
function deleteRoom(fid,rid){
  const f=findFloor(fid);
  if(f.rooms.length<=1){alert('樓層至少需保留一個房間');return;}
  if(!confirm('刪除此房間？'))return;
  f.rooms = f.rooms.filter(r=>r.id!==rid);
  selection.page='summary'; selection.roomId=f.rooms[0].id;
  renderAll();
}

/* =========================== Tabs =========================== */
const TABS = [
  {key:'geometry', label:'幾何 / 構造'},
  {key:'envelope', label:'外牆 / 開窗 / 屋頂'},
  {key:'internal', label:'內部負荷'},
  {key:'vent', label:'通風 / 滲透'},
  {key:'results', label:'計算結果'}
];
function renderTabs(){
  const bar = document.getElementById('tabbar');
  if(!selection.roomId){bar.innerHTML='';return;}
  bar.innerHTML = TABS.map(t=>`<button class="tabbtn ${activeTab===t.key?'active':''}" onclick="setTab('${t.key}')">${t.label}</button>`).join('');
}
function setTab(k){activeTab=k; renderTabs(); renderContent();}

/* =========================== Content 渲染 =========================== */
function renderContent(){
  const c = document.getElementById('content');
  if(selection.page==='weather'){
    c.innerHTML = renderWeatherPageHTML();
    setTimeout(drawWeatherCharts,30);
    return;
  }
  if(!selection.roomId){
    c.innerHTML = renderBuildingSummaryHTML();
    if(state.project.mode==='annual') setTimeout(drawAnnualBuildingCharts,30);
    else setTimeout(drawBuildingCharts,30);
    return;
  }
  const {room} = findRoom(selection.roomId);
  let html='';
  if(activeTab==='geometry') html = roomGeometryHTML(room);
  else if(activeTab==='envelope') html = roomEnvelopeHTML(room);
  else if(activeTab==='internal') html = roomInternalHTML(room);
  else if(activeTab==='vent') html = roomVentHTML(room);
  else if(activeTab==='results') html = roomResultsHTML(room);
  c.innerHTML = html;
  if(activeTab==='results') setTimeout(()=>drawRoomCharts(room),30);
}

function dailyAggregate(arr8760, mode){
  const out=[];
  for(let d=0; d<365; d++){
    const seg = arr8760.slice(d*24,(d+1)*24);
    if(mode==='avg') out.push(seg.reduce((a,b)=>a+b,0)/24);
    else if(mode==='max') out.push(Math.max(...seg));
    else if(mode==='min') out.push(Math.min(...seg));
  }
  return out;
}

  const mode = state.project.mode;
  const modeToggleHTML = `
  <div class="card">
    <div class="card-head">專案設定</div>
    <div class="card-body grid">
      <div class="field"><label>專案名稱</label><input type="text" value="${state.project.name}" onchange="updateProjectName(this.value)"></div>
      <div class="field"><label>模擬模式</label>
        <select onchange="updateMode(this.value)">
          <option value="design" ${mode==='design'?'selected':''}>簡化設計日模式（單日24hr，設計條件模擬）</option>
          <option value="annual" ${mode==='annual'?'selected':''}>六縣市全年真實逐時模式（365天×24hr，CODiS實測資料）</option>
        </select></div>
      ${mode==='design' ? `
      <div class="field"><label>地點 / 氣象站（設計值）</label>
        <select onchange="updateCity(this.value)">
          ${Object.entries(CITY_PRESETS).map(([k,v])=>`<option value="${k}" ${state.project.city===k?'selected':''}>${v.label}</option>`).join('')}
        </select></div>
      <div class="field"><label>夏季室外乾球 <span class="unit">°C</span></label><input type="number" step="0.1" value="${dc.summerDB}" onchange="updateDC('summerDB',this.value)"></div>
      <div class="field"><label>夏季室外濕球 <span class="unit">°C</span></label><input type="number" step="0.1" value="${dc.summerWB}" onchange="updateDC('summerWB',this.value)"></div>
      <div class="field"><label>日溫差 Daily Range <span class="unit">°C</span></label><input type="number" step="0.1" value="${dc.dailyRange}" onchange="updateDC('dailyRange',this.value)"></div>
      ` : `
      <div class="field"><label>地點 / 氣象站（六縣市實測）</label>
        <select onchange="updateRealCity(this.value)">
          ${REAL_CITY_LIST.map(c=>`<option value="${c.key}" ${state.project.realCity===c.key?'selected':''}>${c.label}</option>`).join('')}
        </select></div>
      `}
      <div class="field"><label>室內設定乾球 <span class="unit">°C</span></label><input type="number" step="0.1" value="${dc.indoorDB}" onchange="updateDC('indoorDB',this.value)"></div>
      <div class="field"><label>室內設定相對濕度 <span class="unit">%</span></label><input type="number" step="1" value="${dc.indoorRH}" onchange="updateDC('indoorRH',this.value)"></div>
    </div>
    ${mode==='annual' ? `<div class="card-body" style="padding-top:0"><div class="note">全年真實逐時模式：外氣「乾球溫度／相對濕度」直接讀取六縣市 CODiS 全年逐時資料庫，取代夏季設計值；上方「夏季室外乾球/濕球/日溫差」欄位於此模式不使用（僅設計日模式適用）。輸入資料仍沿用左側樹狀清單中已建立之樓層/房間構造與內部負荷資料。</div></div>` : ''}
  </div>` + (mode==='annual' ? renderAnnualBuildingHTML() : _origBuildingHTML());
  return modeToggleHTML;
};
function updateProjectName(v){state.project.name=v;}
function updateMode(v){ state.project.mode=v; renderContent(); }
function updateCity(v){
  state.project.city=v;
  if(v!=='custom'){ state.project.designConditions = clone(CITY_PRESETS[v]); }
  renderContent();
}
function updateDC(key,val){ state.project.designConditions[key]=parseFloat(val); _annualCache=null; renderContent(); }
window.updateProjectName=updateProjectName; window.updateMode=updateMode; window.updateCity=updateCity; window.updateDC=updateDC;

/* =========================== 初始化 =========================== */
window.selectSummary=selectSummary; window.selectWeather=selectWeather; window.selectFloor=selectFloor; window.selectRoom=selectRoom;
window.addFloor=addFloor; window.addRoom=addRoom; window.renameFloor=renameFloor; window.renameRoom=renameRoom;
window.deleteFloor=deleteFloor; window.deleteRoom=deleteRoom; window.setTab=setTab;

function renderAll(){ renderTree(); renderTabs(); renderContent(); }
selection.page='summary'; selection.floorId=null; selection.roomId=null; // start at building summary
renderAll();
</script>
</body>
</html>
